<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkHours Pro - Controle de Ponto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Estilo para esconder setas de inputs number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .sidebar-item { transition: background 0.15s, color 0.15s; }
        .sidebar-item.active { background: #4f46e5; color: #fff; }
        .sidebar-item.active .sidebar-month-label { color: #fff; }
        .sidebar-item.active .sidebar-month-sub { color: #c7d2fe; }
        .sidebar-item:not(.active):hover { background: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">WorkHours Pro</h1>
            </div>
            <div class="flex items-center gap-4">
                <button id="btn-export" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition-colors shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span class="hidden sm:inline">Exportar Excel</span>
                </button>
                <div id="header-stats" class="hidden sm:flex gap-4 text-sm font-medium text-slate-500 border-l pl-4">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Sidebar: Meses -->
        <aside class="lg:col-span-2">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden sticky top-20">
                <div class="px-4 pt-4 pb-2 border-b border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Meses</p>
                </div>
                <nav id="month-sidebar" class="py-2 space-y-0.5 px-2 max-h-[70vh] overflow-y-auto">
                    <!-- Injetado via JS -->
                </nav>
            </div>
        </aside>

        <!-- Coluna Centro: Perfil e Form -->
        <div class="lg:col-span-4 space-y-6">

            <!-- Card Perfil -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex items-center gap-2 mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wide">Perfil do Colaborador</h2>
                </div>
                <div class="space-y-3">
                    <div>
                        <label for="profile-name" class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nome Completo</label>
                        <input type="text" id="profile-name" placeholder="Seu nome" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="profile-id" class="block text-[10px] font-bold text-slate-400 uppercase mb-1">MatrÃ­cula</label>
                            <input type="text" id="profile-id" placeholder="Ex: 12345" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        </div>
                        <div>
                            <label for="profile-role" class="block text-[10px] font-bold text-slate-400 uppercase mb-1">FunÃ§Ã£o</label>
                            <input type="text" id="profile-role" placeholder="Ex: Analista" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Cards de Resumo -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <p for-stat="worked-label" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Trabalhado no mês</p>
                    <p id="total-worked" class="text-xl font-bold text-slate-800">0h 00min</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <p for-stat="overtime-label" class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-1">Extras no mês</p>
                    <p id="total-overtime" class="text-xl font-bold text-indigo-600">0h 00min</p>
                </div>
            </div>

            <!-- FormulÃ¡rio de Registro -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex items-center gap-2 mb-6">
                    <h2 id="form-title" class="text-lg font-bold text-slate-800">Novo Registro</h2>
                </div>

                <form id="work-form" class="space-y-4">
                    <input type="hidden" id="edit-id">

                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label for="date" class="block text-sm font-semibold text-slate-700 mb-1">Data</label>
                            <input type="date" id="date" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label for="entry" class="block text-sm font-semibold text-slate-700 mb-1">Entrada</label>
                            <input type="time" id="entry" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label for="exit" class="block text-sm font-semibold text-slate-700 mb-1">SaÃ­da</label>
                            <input type="time" id="exit" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label for="break" class="block text-sm font-semibold text-slate-700 mb-1">Pausa (minutos)</label>
                        <input type="number" id="break" value="60" min="0" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>

                    <div>
                        <label for="note" class="block text-sm font-semibold text-slate-700 mb-1">Nota (Opcional)</label>
                        <textarea id="note" maxlength="200" rows="3" placeholder="Ex: Projeto X, Home Office..." class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
                        <p class="text-[10px] text-right text-slate-400 mt-1"><span id="char-count">0</span>/200</p>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="btn-submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition-colors">
                            Salvar Registro
                        </button>
                        <button type="button" id="btn-cancel" class="hidden px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-lg transition-colors">
                            Cancelar
                        </button>
                    </div>
                </form>
            </section>
        </div>

        <!-- Coluna Direita: Lista -->
        <div class="lg:col-span-6 space-y-6">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-lg font-bold text-slate-800">Historico de Atividades</h2>
                <span id="record-count" class="text-xs text-slate-400 font-medium">0 registros</span>
            </div>

            <div id="history-list" class="space-y-4">
                <!-- Injetado via JS -->
                <div class="bg-white border-2 border-dashed border-slate-200 rounded-2xl p-12 text-center text-slate-400">
                    Carregando registros...
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="index.js"></script>
</body>
</html>
